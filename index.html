<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="尼罗河惨案">
<title>尼罗河惨案 · 人物关系网</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{
  --bg:#121316; --panel:#1a1c21; --panel2:#22252b; --line:#3a3e46; --line2:#2a2d33;
  --txt:#eceef1; --dim:#a4aab4; --mute:#737984;
  --accent:#ffd426; --red:#ff4d5e;
  --dock:64px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
  --sans:"Bahnschrift","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 45% 42%,#1e2127 0%,#14161a 55%,#0d0e10 100%);
  color:var(--txt);font:15px/1.7 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
#graph{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#graph.panning{cursor:grabbing}

/* ---------- 顶栏 ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;pointer-events:none;
  padding:calc(10px + var(--sat)) 14px 22px;background:linear-gradient(180deg,rgba(8,9,11,.92),rgba(8,9,11,0))}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;font-size:18px;line-height:1.15;letter-spacing:.12em;font-weight:800;white-space:nowrap}
.brand small{display:block;margin-top:2px;font-size:10.5px;letter-spacing:.3em;color:var(--dim)}
#helpBtn{margin-left:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(20,22,26,.9);font-weight:700;color:var(--dim)}

/* ---------- 底部操作栏 ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:8px 10px calc(8px + var(--sab));
  background:rgba(20,22,26,.97);border-top:1px solid var(--line)}
.dk{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 4px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel2);font-size:12px;color:var(--dim);line-height:1.2}
.dk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dk:active{transform:scale(.97)}
.dk.main{flex:2.3;flex-direction:row;gap:10px;border-color:var(--accent);background:var(--accent);color:#17181b;text-align:left;padding:0 12px}
.dk.main b{display:block;font-size:15px;letter-spacing:.04em}
.dk.main i{display:block;font-style:normal;font-size:11.5px;opacity:.78}
.dk.main .ring{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.14);font-weight:800;font-size:12px;letter-spacing:-.02em}
.dk.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,212,38,.28)}}

/* ---------- 底部卡片（人物 / 关系 / 各种弹层） ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;max-height:84vh;max-height:84dvh;
  background:var(--panel);border-top:2px solid var(--accent);border-radius:18px 18px 0 0;
  transform:translateY(106%);visibility:hidden;transition:transform .36s cubic-bezier(.2,.9,.25,1),visibility 0s linear .36s;padding-bottom:var(--sab);
  box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.sheet.open{transform:none;visibility:visible;transition:transform .36s cubic-bezier(.2,.9,.25,1),visibility 0s}
#detail{z-index:22;bottom:calc(var(--dock) + var(--sab) + 14px);max-height:46vh;max-height:46dvh;padding-bottom:0}
#detail.tall{max-height:78vh;max-height:78dvh}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:pointer}
.grab i{width:44px;height:4px;border-radius:2px;background:var(--line)}
.sbody{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 18px 20px;min-height:0;flex:1}
.sbody::-webkit-scrollbar{width:5px}.sbody::-webkit-scrollbar-thumb{background:#3a3e46}
.shead{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 6px}
.shead h2{margin:0;font-size:20px;letter-spacing:.06em}
.shead small{color:var(--dim);font-size:13px}
.xbtn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1;color:var(--dim)}
#backdrop{position:fixed;inset:0;z-index:28;background:rgba(5,6,8,.62);opacity:0;pointer-events:none;transition:opacity .3s}
#backdrop.on{opacity:1;pointer-events:auto}
.sheet.modal{z-index:32}

.dialog{position:fixed;left:50%;top:50%;z-index:40;width:min(88vw,380px);padding:22px 20px 18px;border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:16px;
  background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1)}
.dialog.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dialog h3{margin:0 0 8px;font-size:18px}
.dialog p{margin:0 0 16px;color:var(--dim);font-size:14.5px}
.dialog .row{display:flex;gap:10px}
.btn{flex:1;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#17181b}
.linkbtn{border:0;background:transparent;color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px 6px}

#toast{position:fixed;left:50%;bottom:calc(var(--dock) + var(--sab) + 22px);z-index:45;width:max-content;max-width:88vw;padding:10px 18px;border-radius:16px;
  background:rgba(255,212,38,.97);color:#17181b;font-weight:700;font-size:14.5px;line-height:1.45;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translate(-50%,18px);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.25,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:12.5px;font-weight:600;opacity:.8}

/* ---------- 卡片内容 ---------- */
.who{display:flex;gap:14px;align-items:center;margin:2px 0 12px;padding-right:44px}
.who h2{margin:0;font-size:19px;line-height:1.3;letter-spacing:.02em}
.who .en{margin-top:2px;font-size:11px;letter-spacing:.14em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{display:inline-block;padding:1px 10px;font-size:12.5px;border:1px solid var(--c,var(--line));color:var(--c,var(--dim));border-radius:999px}
.chip.nick{--c:var(--accent);font-weight:700}
.alt{margin:8px 0 0;font-size:12.5px;color:var(--mute)}
.sec{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line2);font-size:11px;font-weight:400;letter-spacing:.22em;color:var(--mute)}
.sec span{font-size:14px;letter-spacing:.1em;color:var(--txt);font-weight:700}
.sec b{margin-left:auto;font-size:12.5px;color:var(--dim);font-weight:400;letter-spacing:.04em}
.note{margin:0 0 9px;padding-left:12px;border-left:2px solid var(--line);color:#d0d4db;font-size:15px;line-height:1.85}
.note.fresh{border-left-color:var(--accent);color:#f5f1d8}
.note.fresh::before{content:"新";display:inline-block;margin-right:7px;padding:0 6px;border-radius:4px;background:var(--accent);color:#17181b;font-size:11px;font-weight:800;vertical-align:1px}
.rel{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 6px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.rel:active{background:rgba(255,255,255,.06)}
.rel .bar{flex:none;width:3px;align-self:stretch;margin:6px 0;background:var(--c);border-radius:2px}
.rel .nm{font-weight:700;font-size:15px;line-height:1.3}
.rel .nm small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.rel .ar{color:var(--dim);font-weight:400}
.rel .lb{margin-left:auto;flex:none;font-size:12.5px;padding:1px 9px;border:1px solid var(--c);color:var(--c);border-radius:999px}
.back{margin:0 0 10px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:13px;color:var(--dim)}
.pair{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:4px 0 12px}
.pn{display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;padding:6px 0;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:700;text-align:center;line-height:1.3}
.pn:active{background:rgba(255,255,255,.06)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mid .lab{padding:2px 12px;border:1px solid var(--c);color:var(--c);font-size:14px;font-weight:700;white-space:nowrap;border-radius:999px}
.mid .ln{width:100%;height:0;border-top:2px solid var(--c)}
.mid.harm .ln{border-top-style:dashed}.mid.rift .ln{border-top-style:dotted}

/* 进度 */
.lead{margin:2px 0 14px;color:var(--dim);font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 40px}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line2)}
.tl li:last-child::before{display:none}
.tl .dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tl .done .dot{background:var(--accent);border-color:var(--accent);color:#17181b}
.tl .cur .dot{box-shadow:0 0 0 4px rgba(255,212,38,.25)}
.tl b{display:block;font-size:15.5px;line-height:1.4}
.tl span.r{display:block;margin-top:2px;font-size:13.5px;color:var(--dim);line-height:1.7}
.tl .next .dot{border-style:dashed}
.tl .next b{color:var(--dim)}
.tl .next .btn{margin-top:10px;width:100%}
.mini{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line2)}

/* 人物速查 */
.search{display:flex;align-items:center;gap:8px;margin:4px 0 10px;padding:0 14px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;font-size:16px}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round}
.gh{margin:14px 0 4px;font-size:12px;letter-spacing:.18em;color:var(--mute);display:flex;align-items:center;gap:8px}
.gh::before{content:"";width:12px;height:12px;background:var(--c);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:6px 4px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.prow:active{background:rgba(255,255,255,.06)}
.prow .t{min-width:0}
.prow .t b{display:block;font-size:16px;line-height:1.3}
.prow .t i{display:block;font-style:normal;font-size:12.5px;color:var(--dim);line-height:1.4}
.prow .t u{text-decoration:none;color:var(--accent);font-weight:700}
.prow .new{margin-left:auto;flex:none;padding:0 7px;border-radius:4px;background:var(--accent);color:#17181b;font-size:11px;font-weight:800}
.empty{padding:24px 0;text-align:center;color:var(--mute)}

/* 图例 */
.krow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:4px 4px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left}
.krow .sw{flex:none;width:34px;height:0;border-top:3px solid var(--c)}
.krow[data-k=harm] .sw{border-top-style:dashed}.krow[data-k=rift] .sw{border-top-style:dotted}
.krow b{font-size:15px}.krow i{display:block;font-style:normal;font-size:12.5px;color:var(--dim)}
.krow .st{margin-left:auto;font-size:12px;color:var(--mute)}
.krow[aria-pressed=false]{opacity:.4}
.grow{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:14px}
.grow::before{content:"";flex:none;width:16px;height:16px;background:var(--c);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}

/* 首次进入 */
.intro h2{margin:2px 0 4px;font-size:24px;letter-spacing:.1em}
.intro .en{margin:0 0 14px;font-size:10.5px;letter-spacing:.28em;color:var(--mute)}
.steps{list-style:none;margin:0 0 16px;padding:0;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 40px;color:#d0d4db;font-size:15px;line-height:1.7}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#17181b;font-weight:800;font-size:13px}
.steps b{color:var(--txt)}
.tip{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--dim);font-size:13.5px}

/* ---------- 关系图（SVG） ---------- */
.bgword{font:800 120px/1 var(--sans);letter-spacing:.06em;fill:#fff;fill-opacity:.022}
.edge,.elabel{transition:opacity .45s}
.edge .line{fill:none;stroke:var(--c);stroke-width:1.8;stroke-opacity:.85;transition:stroke .4s,stroke-width .2s}
.edge.k-harm .line{stroke-dasharray:8 5;animation:flow 1.1s linear infinite}
.edge.k-rift .line{stroke-dasharray:1.5 5.5;stroke-linecap:round;stroke-width:2.6}
.edge .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:pointer}
.edge.hl .line,.edge.sel .line{stroke-width:3;stroke-opacity:1}
.edge.dim,.elabel.dim{opacity:.1}
.edge.off,.elabel.off{opacity:0;pointer-events:none}
.edge.off .hit{pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-13}}
.elabel{cursor:pointer}
.elabel rect{fill:#121316;stroke:var(--c);stroke-opacity:.8}
.elabel text{fill:#e4e8ee;font-size:12.5px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.elabel.hl rect,.elabel.sel rect{fill:var(--c);stroke-opacity:1}
.elabel.hl text,.elabel.sel text{fill:#111216;font-weight:700}
.elabel.fresh rect{animation:lblpop .9s ease-out 2}
@keyframes lblpop{50%{stroke-width:3.2;stroke-opacity:1}}
#graph.lo .elabel:not(.hl):not(.sel){opacity:0;pointer-events:none}

.node{cursor:pointer;transition:opacity .35s}
.node.locked{display:none}
.node.dim{opacity:.2}
.node .ni{transform-origin:0 0}
.node.enter .ni{animation:enter .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes enter{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.node .ring{fill:none;stroke:var(--c);stroke-opacity:.35;stroke-dasharray:3 5}
.node .hex-main{stroke:var(--c);stroke-width:2.4}
.node .hex-in{fill:rgba(8,9,11,.55);stroke:#fff;stroke-opacity:.16}
.node .mono{fill:#fff;font-size:30px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.hl .hex-main{stroke-width:3.6}
.node .sel-ring{display:none;fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:7 6;animation:spin 1.4s linear infinite}
.node.sel .sel-ring{display:block}
.node.sel .hex-main{filter:drop-shadow(0 0 8px var(--c))}
@keyframes spin{to{stroke-dashoffset:-26}}
.newtag{display:none;pointer-events:none}
.node.fresh .newtag{display:block}
.node.fresh .ring{stroke:var(--accent);stroke-opacity:.9;animation:ringp 1.5s ease-in-out infinite}
@keyframes ringp{50%{stroke-opacity:.2}}
.newtag rect{fill:var(--accent)}.newtag text{fill:#17181b;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
.plate rect.bg{fill:#0e0f12;stroke:#353941}
.plate rect.bar{fill:var(--c)}
.plate .cn{fill:#f3f4f6;font-size:14.5px;font-weight:700;text-anchor:middle}
.plate .rl{fill:#9aa1ac;font-size:10.5px;text-anchor:middle}
.badge{pointer-events:none}
.badge rect{stroke:none}
.badge text{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-anchor:middle;dominant-baseline:central}
.badge.killer rect{fill:var(--red)}.badge.killer text{fill:#1a0508}
.badge.dead rect{fill:#caced6}.badge.dead text{fill:#16171a}
.badge.sus rect{fill:#ff9f43}.badge.sus text{fill:#1d1105}
.node.isdead .mono{opacity:.45}
.node.isdead .hex-main{stroke-dasharray:5 4}

/* ---------- 桌面端 ---------- */
@media (min-width:900px){
  :root{--dock:60px}
  #top{padding:16px 24px 28px}
  .brand h1{font-size:21px}
  #dock{left:50%;right:auto;bottom:16px;width:min(620px,calc(100vw - 440px));transform:translateX(-50%);border:1px solid var(--line);border-radius:16px;padding:8px}
  .sheet{left:50%;right:auto;width:min(520px,92vw);transform:translate(-50%,106%);border-radius:18px 18px 0 0}
  .sheet.open{transform:translate(-50%,0)}
  .sheet.modal{bottom:auto;top:50%;border-radius:18px;border:1px solid var(--line);border-top:2px solid var(--accent);max-height:80vh;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility 0s linear .3s}
  .sheet.modal.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility 0s}
  #detail{left:auto;right:16px;top:76px;bottom:16px;width:380px;max-height:none;transform:translateX(110%);border-radius:18px;border:1px solid var(--line);border-top:2px solid var(--accent)}
  #detail.open{transform:none}
  .grab{display:none}
  #detail .sbody{padding-top:18px}
  #toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){
  .edge.k-harm .line,.node .sel-ring,.dk.pulse,.node.fresh .ring,.elabel.fresh rect{animation:none}
  .sheet,.dialog,#toast,#backdrop{transition:none}
}
</style>
</head>
<body>
<svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="尼罗河惨案人物关系图"></svg>

<header id="top">
  <div class="brand">
    <svg width="30" height="34" viewBox="-20 -22 40 44" aria-hidden="true">
      <polygon points="-10,-17.3 10,-17.3 20,0 10,17.3 -10,17.3 -20,0" fill="none" stroke="#ffd426" stroke-width="2.2"/>
      <polygon points="-5.5,-9.5 5.5,-9.5 11,0 5.5,9.5 -5.5,9.5 -11,0" fill="#ffd426"/>
    </svg>
    <div><h1>尼罗河惨案</h1><small>人物关系网</small></div>
  </div>
  <button id="helpBtn" type="button" aria-label="使用说明">?</button>
</header>

<nav id="dock" aria-label="操作栏">
  <button class="dk main" id="btnProg" type="button">
    <span class="ring" id="progRing">1/12</span>
    <span><b>阅读进度</b><i id="progHint">解锁新剧情</i></span>
  </button>
  <button class="dk" id="btnPeople" type="button">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6.2 4.5 2.2 4.5 5"/></svg>
    人物
  </button>
  <button class="dk" id="btnLegend" type="button">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16" stroke-dasharray="3 3"/><path d="M4 17h16" stroke-dasharray="1 4"/></svg>
    图例
  </button>
  <button class="dk" id="btnFit" type="button">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    全图
  </button>

let PS = 1; // 名牌与标签的反向缩放：画面缩小时让字不至于太小
const plateTop = R * .866 + 10;
function clipSeg(ax, ay, bx, by, box) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dy = by - ay, p = [-dx, dx, -dy, dy], q = [ax - box[0], box[2] - ax, ay - box[1], box[3] - ay];
  for (let k = 0; k < 4; k++) {
    if (p[k] === 0) { if (q[k] < 0) return null; continue; }
    const r = q[k] / p[k];
    if (p[k] < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [t0, t1];
}
function anchorDistAt(n, px, py, tx, ty, ps) {
  const dx = tx - px, dy = ty - py, L = Math.hypot(dx, dy) || 1, FAR = 900;
  const hw = n.w / 2 * ps + 3, top = py + plateTop - 3, h = 34 * ps + 6;

  return Math.max(R + 9, hit ? hit[1] * FAR + 2 : 0);
}

function edgeGeom(e, ax, ay, bx, by, ps) {

  const cx = mx - dy / len * e.bend, cy = my + dx / len * e.bend;
  const da = anchorDistAt(e.A, ax, ay, cx, cy, ps), db = anchorDistAt(e.B, bx, by, cx, cy, ps);
  const ua = Math.hypot(cx - ax, cy - ay) || 1, ub = Math.hypot(cx - bx, cy - by) || 1;
  const sx = ax + (cx - ax) / ua * da, sy = ay + (cy - ay) / ua * da;
  const ex = bx + (cx - bx) / ub * db, ey = by + (cy - by) / ub * db;
  return {sx, sy, cx, cy, ex, ey, lx:.25 * sx + .5 * cx + .25 * ex, ly:.25 * sy + .5 * cy + .25 * ey};

// 连线上的标签：优先放在中点；中点被名牌或别的标签盖住时，沿着连线滑到最近的空位
const T_CAND = [.5, .42, .58, .34, .66, .27, .73, .2, .8];

  const vis = visNodes(), ps = PS, boxes = vis.map(n => boxAt(n, n.x, n.y, ps)), placed = [];
  EDGES.forEach(e => {
    if (!eVis(e) || !e.geom) { e.lx = null; return; }
    const g = e.geom, lw = (parseFloat(e.rect.getAttribute('width')) || 70) * ps, lh = 22 * ps + 2;
    let bx = g.lx, by = g.ly, ba = 1e9;
    for (const t of T_CAND) {
      const m = 1 - t, x = m * m * g.sx + 2 * m * t * g.cx + t * t * g.ex, y = m * m * g.sy + 2 * m * t * g.cy + t * t * g.ey;
      const box = [x - lw / 2, y - lh / 2, x + lw / 2, y + lh / 2];
      let a = Math.abs(t - .5) * 30;
      for (const b of boxes) a += overlapArea(box, b);
      for (const b of placed) a += overlapArea(box, b) * .6;
      if (a < ba) { ba = a; bx = x; by = y; if (a < 1) break; }

    e.lx = e.lx == null ? bx : e.lx + (bx - e.lx) * .4; e.ly = e.ly == null ? by : e.ly + (by - e.ly) * .4;

}

/* =====================================================================
   镜头：目标值 + 缓动，拖动平移带惯性
   ===================================================================== */
const cam = {x:0, y:0, k:1}, tgt = {x:0, y:0, k:1};
const camEase = .16;
let panV = {x:0, y:0}, inertia = false;
function applyCam() {
  vp.setAttribute('transform', 'translate(' + cam.x.toFixed(2) + ' ' + cam.y.toFixed(2) + ') scale(' + cam.k.toFixed(4) + ')');
  const ps = clamp(.8 / cam.k, 1, 1.2);
  if (Math.abs(ps - PS) > .01) setPS(ps);
  svg.classList.toggle('lo', cam.k < .62);
}
const isMobile = () => innerWidth < 900;
function insets() {
  const h = innerHeight, dockH = $('#dock').offsetHeight, open = !!(state.sel || state.selEdge);
  if (isMobile()) return {l:10, r:10, t:70, b:dockH + 18 + (open ? Math.min(h * .46, 330) + 8 : 0)};
  return {l:24, r:open ? 412 : 24, t:78, b:dockH + 40};
}
function fitTo(nodes, opt) {
  opt = opt || {};
  if (!nodes.length) return;
  const I = insets();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  nodes.forEach(n => { const hw = Math.max(R, n.w / 2) + 8; x0 = Math.min(x0, n.hx - hw); x1 = Math.max(x1, n.hx + hw); y0 = Math.min(y0, n.hy - R - 10); y1 = Math.max(y1, n.hy + plateTop + 40); });
  const aw = innerWidth - I.l - I.r, ah = innerHeight - I.t - I.b;
  const minK = opt.minK != null ? opt.minK : (isMobile() ? .56 : .3);
  const k = clamp(Math.min(aw / (x1 - x0), ah / (y1 - y0)), minK, opt.maxK || 1.25);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  tgt.k = k; tgt.x = I.l + aw / 2 - cx * k; tgt.y = I.t + ah / 2 - cy * k;
  inertia = false;
  if (opt.snap || REDUCE) { Object.assign(cam, tgt); applyCam(); }
  wake();
}
const visNodes = () => NODES.filter(nVis);
function fitAll(snap) { state.moved = false; fitTo(visNodes(), {snap, maxK:1.15}); }
function focusCluster(ids) { const set = new Set(ids); fitTo(NODES.filter(n => set.has(n.id)), {minK:isMobile() ? .5 : .7, maxK:1.15}); }
function clusterOf(id) {
  const s = new Set([id]);
  EDGES.forEach(e => { if (eOn(e) && (e.a === id || e.b === id)) { s.add(e.a); s.add(e.b); } });
  return [...s];
}
function zoomDirect(cx, cy, f) {
  const k = clamp(cam.k * f, .3, 3), r = k / cam.k;
  cam.x = cx - (cx - cam.x) * r; cam.y = cy - (cy - cam.y) * r; cam.k = k;
  Object.assign(tgt, cam); state.moved = true; applyCam();
}
function zoomTarget(cx, cy, f) {
  const k = clamp(tgt.k * f, .3, 3), r = k / tgt.k;
  tgt.x = cx - (cx - tgt.x) * r; tgt.y = cy - (cy - tgt.y) * r; tgt.k = k;
  state.moved = true; inertia = false; wake();
}
const toWorld = (cx, cy) => ({x:(cx - cam.x) / cam.k, y:(cy - cam.y) / cam.k});

/* =====================================================================
   物理 + 渲染循环
   参考 hub 关系图的做法：力导向（斥力、连线弹簧、名牌防重叠、速度阻尼）。
   这里多加一个「回家」弹簧：拖动人物时，相连的人物跟着被拉动，松手后整张图弹回原来的位置。
   没有动静时循环自动停下，不耗电。
   ===================================================================== */
const HOME_K = .012, EDGE_K = .022, DAMP = .87, VMAX = 14;
let raf = 0, awake = false, lastT = 0;
let drag = null, pinch = null;
function wake() { if (!awake) { awake = true; lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function stepPhysics(dt) {
  const vis = visNodes();
  if (REDUCE) { let any = false; vis.forEach(n => { if (n.drag) { n.x = n.dx; n.y = n.dy; any = true; } }); return any; }
  vis.forEach(n => { n.ax = (n.hx - n.x) * HOME_K; n.ay = (n.hy - n.y) * HOME_K; });
  EDGES.forEach(e => {
    if (!eVis(e)) return;
    const a = e.A, b = e.B, dx = b.x - a.x, dy = b.y - a.y, d = Math.max(1, Math.hypot(dx, dy));
    const L0 = Math.hypot(b.hx - a.hx, b.hy - a.hy), f = (d - L0) * EDGE_K, ux = dx / d, uy = dy / d;
    a.ax += ux * f; a.ay += uy * f; b.ax -= ux * f; b.ay -= uy * f;
  });
  for (let i = 0; i < vis.length; i++) for (let j = i + 1; j < vis.length; j++) {
    const a = vis[i], b = vis[j]; let dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
    if (d < .01) { d = .01; dx = 1; dy = 0; }
    if (d < 280) { const f = Math.min(.4, 1400 / (d * d)); a.ax += dx / d * f; a.ay += dy / d * f; b.ax -= dx / d * f; b.ay -= dy / d * f; }
    const needX = (a.w + b.w) / 2 + 12, needY = 108;
    const ox = needX - Math.abs(dx), oy = needY - Math.abs(dy);
    if (ox > 0 && oy > 0) {
      if (ox <= oy) { const s = (dx < 0 ? -1 : 1) * ox * .06; a.ax += s; b.ax -= s; }
      else { const s = (dy < 0 ? -1 : 1) * oy * .1; a.ay += s; b.ay -= s; }
    }
  }
  let moving = false;
  const damp = Math.pow(DAMP, dt);
  vis.forEach(n => {
    if (n.drag) { // 被手指拖着的人物：平滑跟手，同时记录速度，松手时带着惯性冲出去
      const f = 1 - Math.pow(1 - .4, dt), ox = n.x, oy = n.y;
      n.x += (n.dx - n.x) * f; n.y += (n.dy - n.y) * f;
      n.vx = (n.x - ox) / dt; n.vy = (n.y - oy) / dt; moving = true; return;
    }
    n.vx = clamp((n.vx + n.ax * dt) * damp, -VMAX, VMAX); n.vy = clamp((n.vy + n.ay * dt) * damp, -VMAX, VMAX);
    n.x += n.vx * dt; n.y += n.vy * dt;
    if (Math.abs(n.vx) + Math.abs(n.vy) > .03 || Math.abs(n.hx - n.x) + Math.abs(n.hy - n.y) > .25) moving = true;
  });
  return moving;
}
function stepCamera(dt) {
  if (inertia) {
    const f = Math.pow(.92, dt);

    cam.x += panV.x * dt; cam.y += panV.y * dt; tgt.x = cam.x; tgt.y = cam.y;
    if (Math.abs(panV.x) + Math.abs(panV.y) < .08) inertia = false;
    return true;
  }
  const dx = tgt.x - cam.x, dy = tgt.y - cam.y, dk = tgt.k - cam.k;
  if (Math.abs(dx) < .15 && Math.abs(dy) < .15 && Math.abs(dk) < .0008) { if (dx || dy || dk) { cam.x = tgt.x; cam.y = tgt.y; cam.k = tgt.k; } return false; }
  const f = 1 - Math.pow(1 - camEase, dt);
  cam.x += dx * f; cam.y += dy * f; cam.k += dk * f;

}

  NODES.forEach(n => { if (nVis(n)) placeNode(n); });
  EDGES.forEach(e => { if (eVis(e)) placeEdge(e); });
  placeLabels();
  applyCam();
}
function frame(now) {
  const dt = Math.min(2.5, (now - lastT) / 16.667); lastT = now;
  const a = stepPhysics(dt), b = stepCamera(dt);
  render();

}

function refresh() {
  const fn = state.hoverNode || (!state.hoverEdge ? state.sel : null);
  const fe = state.hoverEdge || (!state.hoverNode ? state.selEdge : null);
  const nHL = new Set(), eHL = new Set(); let focusing = false;
  if (fn) { focusing = true; nHL.add(fn); EDGES.forEach(e => { if (eOn(e) && (e.a === fn || e.b === fn)) { eHL.add(e.id); nHL.add(e.a); nHL.add(e.b); } }); }
  else if (fe) { focusing = true; eHL.add(fe); nHL.add(edgeById[fe].a); nHL.add(edgeById[fe].b); }
  NODES.forEach(n => {
    const c = n.el.classList;
    c.toggle('locked', !nVis(n));
    c.toggle('dim', focusing && !nHL.has(n.id));
    c.toggle('hl', focusing && nHL.has(n.id));
    c.toggle('sel', state.sel === n.id);
    c.toggle('fresh', nVis(n) && nFresh(n));
  });
  EDGES.forEach(e => {
    const on = eOn(e), dim = focusing && !eHL.has(e.id), hl = focusing && eHL.has(e.id), sel = state.selEdge === e.id;
    [e.g, e.lab].forEach(el => {
      const c = el.classList;
      c.toggle('off', !on); c.toggle('dim', on && dim); c.toggle('hl', on && hl); c.toggle('sel', on && sel);
    });

}

}
// 人物（六边形加名牌）占的矩形
const boxAt = (n, x, y, ps) => { const hw = Math.max(R, n.w / 2 * ps) + 4; return [x - hw, y - R * .87 - 4, x + hw, y + plateTop + 34 * ps + 4]; };
const overlapArea = (a, b) => { const w = Math.min(a[2], b[2]) - Math.max(a[0], b[0]), h = Math.min(a[3], b[3]) - Math.max(a[1], b[1]); return w > 0 && h > 0 ? w * h : 0; };
// 把 n 放在 (x,y) 时，文字被盖住的程度。hard：人物框互相压住；short：和它相连的线太短，放不下标签（标签会被名牌盖住）。
// 别人按「回家后」的位置算，因为他们被拉开只是暂时的
function coverPenalty(n, x, y, ps, labels) {
  const vis = visNodes(), at = m => m === n ? [x, y] : [m.hx, m.hy];
  const mine = boxAt(n, x, y, ps);
  let hard = 0, short = 0;
  vis.forEach(m => { if (m !== n) { const q = at(m), o = overlapArea(mine, boxAt(m, q[0], q[1], ps)); if (o) hard += 400 + o; } });
  if (labels) EDGES.forEach(e => {
    if (!eVis(e) || (e.A !== n && e.B !== n)) return;
    const a = at(e.A), b = at(e.B), g = edgeGeom(e, a[0], a[1], b[0], b[1], ps);
    const lw = (parseFloat(e.rect.getAttribute('width')) || 70) * ps + 12;
    short += Math.max(0, lw - Math.hypot(g.ex - g.sx, g.ey - g.sy));
  });
  return {hard, lab:short};
}
// 从松手的位置 (x,y) 出发找一个「稍加调整」的位置：人物框压在一起重罚，线太短放不下标签轻罚，挪得越远罚得越多
function settleNode(n, x, y, ps, labels) {
  const MOVE = 14, MAXR = 130;
  const score = (px, py) => { const c = coverPenalty(n, px, py, ps, labels); return c.hard * 50 + c.lab * 9 + MOVE * Math.hypot(px - x, py - y); };
  let best = [x, y], bs = score(x, y);
  if (bs === 0) return best;
  for (let r = 8; r <= MAXR && r * MOVE < bs; r += 8) {
    const steps = Math.max(12, Math.round(r / 4));
    for (let i = 0; i < steps; i++) {
      const ang = i / steps * Math.PI * 2, px = x + Math.cos(ang) * r, py = y + Math.sin(ang) * r;
      const sc = score(px, py);
      if (sc < bs) { bs = sc; best = [px, py]; }
    }
  }
  return best;
}
function dropNode(n) {
  const x = n.dx != null ? n.dx : n.x, y = n.dy != null ? n.dy : n.y;
  const p = settleNode(n, x, y, Math.max(1, PS), true);
  n.hx = p[0]; n.hy = p[1]; n.dx = n.dy = null;
  if (REDUCE) { n.x = n.hx; n.y = n.hy; }
  saveLayout();
}
function resetLayout() {
  NODES.forEach(n => { n.hx = n.ox; n.hy = n.oy; });
  saveLayout(); fitAll(); wake();
}

function select(sel, push) {
  state.prev = push ? (state.selEdge ? {edge:state.selEdge} : state.sel ? {node:state.sel} : null) : null;
  state.sel = sel && sel.node || null; state.selEdge = sel && sel.edge || null;
  state.hoverNode = state.hoverEdge = null;
  if (state.sel && !state.seen.has(state.sel)) { state.seen.add(state.sel); saveSeen(); }
  renderDetail(); refresh();
  if (state.sel) focusCluster(clusterOf(state.sel));
  else if (state.selEdge) focusCluster([edgeById[state.selEdge].a, edgeById[state.selEdge].b]);
}
const selectNode = (id, push) => select({node:id}, push);
const selectEdge = (id, push) => select({edge:id}, push);
const clearSel = () => { if (state.sel || state.selEdge) { select(null, false); fitAll(); } };

let modalId = null;
function openModal(id) {
  closeModal();
  modalId = id; $(id).classList.add('open'); $('#backdrop').classList.add('on');
  if (id === '#mProg') renderProgress();
  if (id === '#mPeople') renderPeople();
  if (id === '#mLegend') renderLegend();
}
function closeModal() {
  if (!modalId) return;
  $(modalId).classList.remove('open'); $('#backdrop').classList.remove('on'); modalId = null; state.catchUp = false;
}
let toastT = 0;
function toast(msg, sub) { const t = $('#toast'); t.textContent = msg; if (sub) { const sm = document.createElement('small'); sm.textContent = sub; t.appendChild(sm); } t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3800); }
let dlgYes = null;
function ask(title, text, yes, yesText, noText) {
  $('#dlgT').textContent = title; $('#dlgP').textContent = text;
  $('#dlgYes').textContent = yesText || '读到了'; $('#dlgNo').textContent = noText || '还没有';
  dlgYes = yes; $('#dlg').classList.add('open'); $('#backdrop').classList.add('on');
}
function closeDlg() { $('#dlg').classList.remove('open'); if (!modalId) $('#backdrop').classList.remove('on'); dlgYes = null; }

function setStage(n, opt) {
  opt = opt || {};
  const old = state.stage, s = clamp(n, 1, N_STAGES);
  if (s === old && !opt.force) return;
  state.stage = s; store.set('nile.stage', String(s));
  // 新出场的人物：从已经在场的相邻人物身边「长出来」
  const born = NODES.filter(x => x.from > old && x.from <= s);
  born.forEach(x => {
    let p = null;
    EDGES.forEach(e => { if (!p && e.from <= s && (e.a === x.id || e.b === x.id)) { const o = e.a === x.id ? e.B : e.A; if (o.from <= old && o.from >= 1) p = o; } });
    if (!opt.snap && p) { x.x = p.x + (Math.random() - .5) * 6; x.y = p.y + (Math.random() - .5) * 6; } else { x.x = x.hx; x.y = x.hy; }
    x.vx = x.vy = 0; placeNode(x);
  });
  const fresh = new Set();
  if (s > old && old > 0) EDGES.forEach(e => { if (eVis(e) && (e.from > old || eSt(e)[0] > old)) fresh.add(e.id); });
  state.freshEdges = fresh;
  if (state.selEdge && !eVis(edgeById[state.selEdge])) state.selEdge = null;
  if (state.sel && !nVis(nodeById[state.sel])) state.sel = null;
  if (!state.sel && !state.selEdge) state.prev = null;
  refresh();                                   // 先把新人物显示出来，才能量出文字宽度
  NODES.forEach(x => { styleNode(x); if (nVis(x)) measureNode(x); });
  EDGES.forEach(e => { styleEdge(e); if (eVis(e)) placeEdge(e); });
  placeLabels();
  let nudged = false;
  born.forEach(x => {
    const q = settleNode(x, x.hx, x.hy, 1, !opt.snap);   // 刚打开页面时只处理人物框重叠，不动原本排好的布局
    if (q[0] !== x.hx || q[1] !== x.hy) { x.hx = q[0]; x.hy = q[1]; if (opt.snap) { x.x = q[0]; x.y = q[1]; placeNode(x); } nudged = true; }
  });
  if (nudged) saveLayout();
  born.forEach(x => { if (!opt.snap && old > 0) { x.el.classList.remove('enter'); void x.el.getBoundingClientRect(); x.el.classList.add('enter'); setTimeout(() => x.el.classList.remove('enter'), 900); } });
  renderProgress(); renderDetail(); renderPeople(); renderLegend(); refresh();
  fitAll(!!opt.snap);
  wake();
  if (!opt.silent && s > old) {
    const names = born.map(x => x.short);
    toast('已解锁：' + STAGES[s - 1].t, names.length ? '新增人物：' + names.join('、') : '');
    if (navigator.vibrate) { try { navigator.vibrate(14); } catch (_) {} }
  }
}
function askNext() {
  if (state.stage >= N_STAGES) return;
  const nx = STAGES[state.stage];
  ask('解锁「' + nx.t + '」？', '这会显示这一段里出现的人物和关系。你已经读到这里了吗？', () => {
    const keep = state.catchUp;
    if (!keep) closeModal();                   // 平时解锁完直接回到图上，看新人物长出来
    setStage(state.stage + 1);
    if (keep) state.catchUp = true;            // 补进度时留在弹层里，方便连续解锁
  });
}

/* =====================================================================
   指针交互：拖人物（弹性）、拖画布（惯性）、双指缩放
   ===================================================================== */
const pts = new Map();
const pdist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
const pmid = () => { const [a, b] = [...pts.values()]; return {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2}; };
svg.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  try { svg.setPointerCapture(ev.pointerId); } catch (_) {}
  pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pts.size === 2) { const m = pmid(); pinch = {d:pdist(), mx:m.x, my:m.y}; if (drag && drag.n) drag.n.drag = false; drag = null; return; }
  const nEl = ev.target.closest('.node'), eEl = ev.target.closest('.edge,.elabel');
  const n = nEl ? nodeById[nEl.dataset.id] : null;
  drag = {type:n ? 'node' : 'pan', n, eid:!n && eEl ? eEl.dataset.id : null, sx:ev.clientX, sy:ev.clientY, cx:cam.x, cy:cam.y, moved:false, lx:ev.clientX, ly:ev.clientY, lt:performance.now(), vx:0, vy:0};
  inertia = false; panV.x = panV.y = 0;
  if (n) { const w = toWorld(ev.clientX, ev.clientY); drag.ox = n.x - w.x; drag.oy = n.y - w.y; }
  wake();
});
window.addEventListener('pointermove', ev => {
  if (!pts.has(ev.pointerId)) return;
  pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pts.size === 2 && pinch) {
    const m = pmid(), d = pdist();
    cam.x += m.x - pinch.mx; cam.y += m.y - pinch.my; Object.assign(tgt, cam);
    zoomDirect(m.x, m.y, d / pinch.d);
    pinch.d = d; pinch.mx = m.x; pinch.my = m.y; wake(); return;
  }
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; if (drag.type === 'pan') svg.classList.add('panning'); if (drag.n) drag.n.drag = true; }
  if (!drag.moved) return;
  state.moved = true;
  if (drag.type === 'pan') {
    const now = performance.now(), dtm = Math.max(1, now - drag.lt);
    drag.vx = drag.vx * .6 + ((ev.clientX - drag.lx) / dtm * 16.667) * .4; drag.vy = drag.vy * .6 + ((ev.clientY - drag.ly) / dtm * 16.667) * .4;
    drag.lx = ev.clientX; drag.ly = ev.clientY; drag.lt = now;
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; Object.assign(tgt, cam);
    applyCam();
  } else {
    const w = toWorld(ev.clientX, ev.clientY); drag.n.dx = w.x + drag.ox; drag.n.dy = w.y + drag.oy;
  }
  wake();
});
function endPointer(ev, cancelled) {
  pts.delete(ev.pointerId);
  if (pts.size < 2) pinch = null;
  if (!drag) return;
  const d = drag; drag = null; svg.classList.remove('panning');
  if (d.n) d.n.drag = false;
  if (ev.pointerType !== 'mouse') state.hoverNode = state.hoverEdge = null;
  if (d.moved || cancelled) {
    if (d.type === 'pan' && !cancelled && !REDUCE && performance.now() - d.lt < 90 && Math.hypot(d.vx, d.vy) > .6) { panV.x = d.vx; panV.y = d.vy; inertia = true; }
    if (d.n && d.moved && !cancelled) dropNode(d.n);   // 留在松手的地方，只微调到不盖字
    refresh(); wake(); return;
  }
  if (d.type === 'node') selectNode(d.n.id, false);
  else if (d.eid) selectEdge(d.eid, false);
  else clearSel();
  wake();
}
window.addEventListener('pointerup', ev => endPointer(ev, false));
window.addEventListener('pointercancel', ev => endPointer(ev, true));
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const f = ev.ctrlKey ? Math.exp(-ev.deltaY * .01) : Math.exp(-ev.deltaY * .0016);
  zoomTarget(ev.clientX, ev.clientY, f);
}, {passive:false});
svg.addEventListener('pointerover', ev => {
  if (drag || ev.pointerType !== 'mouse') return;
  const n = ev.target.closest('.node'), e = ev.target.closest('.edge,.elabel');
  const nid = n ? n.dataset.id : null, eid = !n && e ? e.dataset.id : null;
  if (nid !== state.hoverNode || eid !== state.hoverEdge) { state.hoverNode = nid; state.hoverEdge = eid; refresh(); }
});
svg.addEventListener('pointerleave', () => { if (state.hoverNode || state.hoverEdge) { state.hoverNode = state.hoverEdge = null; refresh(); } });

/* =====================================================================
   按钮
   ===================================================================== */
$('#btnProg').addEventListener('click', () => { $('#btnProg').classList.remove('pulse'); openModal('#mProg'); });
$('#btnPeople').addEventListener('click', () => { $('#q').value = ''; openModal('#mPeople'); });
$('#btnLegend').addEventListener('click', () => openModal('#mLegend'));
$('#btnFit').addEventListener('click', () => fitAll());
$('#helpBtn').addEventListener('click', () => openModal('#mIntro'));
$('#backdrop').addEventListener('click', () => { if ($('#dlg').classList.contains('open')) closeDlg(); else closeModal(); });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal()));
$('#resetPos').addEventListener('click', () => { resetLayout(); closeModal(); toast('已摆回原位'); });
$('#grab').addEventListener('click', () => $('#detail').classList.toggle('tall'));
$('#dlgNo').addEventListener('click', closeDlg);
$('#dlgYes').addEventListener('click', () => { const f = dlgYes; closeDlg(); if (f) f(); });
$('#q').addEventListener('input', renderPeople);
$('#introStart').addEventListener('click', () => { store.set('nile.intro', '1'); closeModal(); });
$('#introCatch').addEventListener('click', () => { store.set('nile.intro', '1'); openModal('#mProg'); state.catchUp = true; });
$('#dbody').addEventListener('click', ev => {
  const b = ev.target.closest('[data-edge],[data-node],[data-act]'); if (!b) return;
  if (b.dataset.edge) selectEdge(b.dataset.edge, true);
  else if (b.dataset.node) selectNode(b.dataset.node, true);
  else if (b.dataset.act === 'back') select(state.prev, false);
  else if (b.dataset.act === 'close') clearSel();
});
$('#progBody').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'next') askNext();
  else if (a === 'prev') setStage(state.stage - 1, {silent:true});
  else if (a === 'all') ask('全部解锁？', '会显示所有人物、凶手和结局。确认你已经读完了。', () => { closeModal(); setStage(N_STAGES); }, '已读完，解锁', '再想想');
  else if (a === 'reset') ask('从头开始？', '会回到第 1 步，已经解锁的内容会重新隐藏。', () => { setStage(1, {silent:true}); }, '从头开始', '取消');
});
$('#pplList').addEventListener('click', ev => {
  const b = ev.target.closest('[data-pick]'); if (!b) return;
  closeModal(); selectNode(b.dataset.pick, false);
});
$('#kindList').addEventListener('click', ev => {
  const b = ev.target.closest('[data-k]'); if (!b) return;
  state.hidden.has(b.dataset.k) ? state.hidden.delete(b.dataset.k) : state.hidden.add(b.dataset.k);
  renderLegend(); refresh();
});
window.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#dlg').classList.contains('open')) closeDlg(); else if (modalId) closeModal(); else clearSel(); } });
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (!state.moved) fitAll(); }, 120); });

/* =====================================================================
   启动：读取上次的进度。
   发给她之前，可以在链接末尾加 #p=7，直接定位到第 7 步。
   ===================================================================== */
(function init() {
  setPS(1);   // 名牌要先放到六边形下方，否则放大到 1 倍时名牌会盖住头像
  let s = parseInt(store.get('nile.stage', '1'), 10) || 1;
  const m = /[#?&]p=(\d+)/.exec(location.hash + location.search);
  if (m) { s = parseInt(m[1], 10); store.set('nile.stage', String(clamp(s, 1, N_STAGES))); }
  state.stage = 0;
  loadLayout();
  NODES.forEach(n => { n.x = n.hx; n.y = n.hy; });
  setStage(clamp(s, 1, N_STAGES), {snap:true, silent:true, force:true});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { NODES.forEach(n => { if (nVis(n)) measureNode(n); }); EDGES.forEach(e => styleEdge(e)); EDGES.forEach(e => { if (eVis(e)) placeEdge(e); }); placeLabels(); fitAll(true); wake(); });
  if (/MicroMessenger/i.test(navigator.userAgent)) $('#tipText').textContent = '你现在是在微信里打开的，进度可能会被清掉，也加不到桌面。点右上角「···」，选「在浏览器打开」，用 Safari 打开后，点底部的分享按钮，选「添加到主屏幕」。';
  if (store.get('nile.intro', '') !== '1') setTimeout(() => openModal('#mIntro'), 350);
  else if (state.stage === 1) $('#btnProg').classList.add('pulse');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
</body>
